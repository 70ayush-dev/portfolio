    <meta charset="UTF-8" />

    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />

    <title>

    <meta
      name="description"
      content="Ayush Singh is a Web Platform Engineer specializing in TYPO3, PHP, Vue/Nuxt, SEO, AEO, GEO, AI integrations and web automation."
    />
    <link rel="canonical" href="https://ayush404.in/" />
    <!--seo-end-->
    <meta name="theme-color" content="#F7F5EF" />
    <script>
      (() => {
        let preference;
        try {
          preference = localStorage.getItem("ayush404-theme");
        } catch {}
        const dark =
          preference === "dark" ||
          (preference !== "light" &&
            window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
        document
          .querySelector('meta[name="theme-color"]')
          .setAttribute("content", dark ? "#000000" : "#F7F5EF");
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
